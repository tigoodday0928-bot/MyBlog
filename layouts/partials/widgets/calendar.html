<section class="widget calendar">
  <script>
    var postDates = [
      {{ range (where .Site.RegularPages "Section" "posts") }}
      "{{ .Date.Format "2006-01-02" }}",
      {{ end }}
    ];
  </script>

  <style>
  .calendar {
    background: #faf8fb !important;
    border-radius: 16px !important;
    border: 1px solid rgba(150,123,182,0.2) !important;
    padding: 1.2rem 1.4rem 1.4rem !important;
  }
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.8rem;
  }
  .calendar-header span {
    font-size: 15px;
    font-weight: 700;
    color: #7a5f85;
    letter-spacing: 0.05em;
  }
  .cal-prev, .cal-next {
    background: none;
    border: none;
    color: #967BB6;
    font-size: 18px;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 6px;
    transition: background 0.2s;
    line-height: 1;
  }
  .cal-prev:hover, .cal-next:hover {
    background: rgba(150,123,182,0.12);
  }
  .cal-divider {
    height: 1.5px;
    background: linear-gradient(to right, transparent, rgba(150,123,182,0.4), transparent);
    margin: 0 0 1rem;
    border-radius: 2px;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .day-name {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: #967BB6;
    padding-bottom: 6px;
    letter-spacing: 0.05em;
  }
  .day {
    text-align: center;
    font-size: 13px;
    color: #555;
    padding: 6px 0;
    border-radius: 8px;
    line-height: 1;
    position: relative;
    transition: background 0.15s;
  }
  .day:hover:not(.empty) {
    background: rgba(150,123,182,0.08);
  }
  .day.today {
    background: rgba(150,123,182,0.15) !important;
    color: #7a5f85 !important;
    font-weight: 700;
    border: 1.5px solid rgba(150,123,182,0.4);
  }
  .day.has-post::after {
    content: '';
    display: block;
    width: 4px;
    height: 4px;
    background: #967BB6;
    border-radius: 50%;
    margin: 2px auto 0;
  }
  .day.today.has-post::after {
    background: #7a5f85;
  }
  </style>

  <div class="calendar-header">
    <button class="cal-prev" onclick="changeMonth(-1)">‹</button>
    <span id="cal-title"></span>
    <button class="cal-next" onclick="changeMonth(1)">›</button>
  </div>
  <div class="cal-divider"></div>

  <div class="calendar-grid">
    <div class="day-name">一</div>
    <div class="day-name">二</div>
    <div class="day-name">三</div>
    <div class="day-name">四</div>
    <div class="day-name">五</div>
    <div class="day-name">六</div>
    <div class="day-name">日</div>
  </div>
  <div class="calendar-grid" id="cal-days"></div>

  <script>
    var currentDate = new Date();
    var currentYear = currentDate.getFullYear();
    var currentMonth = currentDate.getMonth();

    function renderCalendar() {
      var title = document.getElementById('cal-title');
      var daysContainer = document.getElementById('cal-days');
      title.textContent = currentYear + '年 ' + String(currentMonth + 1).padStart(2, '0') + '月';
      var firstDay = new Date(currentYear, currentMonth, 1).getDay();
      firstDay = firstDay === 0 ? 6 : firstDay - 1;
      var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      var html = '';
      for (var i = 0; i < firstDay; i++) {
        html += '<div class="day empty"></div>';
      }
      for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = currentYear + '-' +
          String(currentMonth + 1).padStart(2, '0') + '-' +
          String(d).padStart(2, '0');
        var hasPost = postDates.indexOf(dateStr) !== -1;
        var isToday = (d === currentDate.getDate() &&
          currentMonth === currentDate.getMonth() &&
          currentYear === currentDate.getFullYear());
        var dow = new Date(currentYear, currentMonth, d).getDay();
        var cls = 'day';
        if (hasPost) cls += ' has-post';
        if (isToday) cls += ' today';
        if (dow === 6) cls += ' sat';
        if (dow === 0) cls += ' sun';
        html += '<div class="' + cls + '">' + d + '</div>';
      }
      daysContainer.innerHTML = html;
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    }

    renderCalendar();
  </script>
</section>

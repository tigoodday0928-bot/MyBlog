<a href="{{ .Permalink }}" class="grid-card">
    {{ $image := partial "helper/image" (dict "Image" .Params.image "Resources" .Resources "Context" .) }}
    {{ if $image }}
        <div class="grid-card__thumb">
            <img src="{{ $image.Permalink }}" alt="{{ .Title }}" loading="lazy">
        </div>
    {{ end }}
    <div class="grid-card__info">
        <h2 class="grid-card__title">{{ .Title }}</h2>
        <p class="grid-card__date">{{ .Date.Format "2006/01/02" }}</p>
        {{ with .Description }}
            <p class="grid-card__desc">{{ . }}</p>
        {{ end }}
    </div>
</a>

{{ $images := split (.Get "images") " " }}
{{ $slug := .Page.Slug }}
{{ $id := printf "cs-%s" (md5 (.Get "images")) }}

<div class="carousel-wrapper" id="{{ $id }}">
  <div class="carousel-main">
    <button class="carousel-btn carousel-prev" onclick="csMove('{{ $id }}', -1)">&#8249;</button>
    <div class="carousel-track">
      {{ range $i, $img := $images }}
      <div class="carousel-slide{{ if eq $i 0 }} active{{ end }}">
        <img src="/posts/{{ $slug }}/{{ $img }}" alt="圖片 {{ add $i 1 }}" loading="lazy">
      </div>
      {{ end }}
    </div>
    <button class="carousel-btn carousel-next" onclick="csMove('{{ $id }}', 1)">&#8250;</button>
    <div class="carousel-counter">
      <span class="cs-current">1</span> / {{ len $images }}
    </div>
  </div>
</div>

<style>
.carousel-wrapper { margin: 24px 0; user-select: none; }
.carousel-main { position: relative; overflow: hidden; border-radius: 12px; max-width: 780px; margin: 0 auto; }
.carousel-track { display: flex; height: 100%; transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); }
.carousel-slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.carousel-slide img { width:100% !important; height: auto !important; max-width:100% !important; object-fit: cover !important; border-radius:0 !important; margin:0 !important; }
.carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); z-index: 10; background: rgba(0,0,0,0.45); color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 22px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
.carousel-btn:hover { background: rgba(150,123,182,0.75); }
.carousel-prev { left: 12px; }
.carousel-next { right: 12px; }
.carousel-counter { position: absolute; bottom: 10px; right: 14px; background: rgba(0,0,0,0.5); color: #fff; font-size: 13px; padding: 2px 10px; border-radius: 20px; }
</style>

<script>
(function(){
  const state = {};
  window.csMove = function(id, dir) {
    if (!state[id]) {
      const w = document.getElementById(id);
      state[id] = { slides: w.querySelectorAll('.carousel-slide'), track: w.querySelector('.carousel-track'), current: w.querySelector('.cs-current'), index: 0 };
    }
    const s = state[id];
    s.index = (s.index + dir + s.slides.length) % s.slides.length;
    s.track.style.transform = `translateX(-${s.index * 100}%)`;
    s.current.textContent = s.index + 1;
  };
})();
</script>

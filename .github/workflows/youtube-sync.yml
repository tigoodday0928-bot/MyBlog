name: YouTube Auto Sync

on:
  schedule:
    - cron: '0 2 * * *'  # 每天台灣時間早上10點執行
  workflow_dispatch:  # 也可以手動觸發

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch YouTube Videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_ID: UCfQ1I8T-iw0tAR6dxpbo8Jw
        run: |
          python3 << 'EOF'
          import urllib.request
          import json
          import os
          import re
          from datetime import datetime

          api_key = os.environ['YOUTUBE_API_KEY']
          channel_id = os.environ['CHANNEL_ID']

          url = f"https://www.googleapis.com/youtube/v3/search?key={api_key}&channelId={channel_id}&part=snippet&order=date&maxResults=10&type=video"
          
          with urllib.request.urlopen(url) as response:
              data = json.loads(response.read())

          os.makedirs("content/posts/youtube", exist_ok=True)

          for item in data.get("items", []):
              video_id = item["id"]["videoId"]
              snippet = item["snippet"]
              title = snippet["title"]
              description = snippet["description"][:200]
              published = snippet["publishedAt"][:10]
              thumbnail = snippet["thumbnails"]["high"]["url"]
              
              # 用 video_id 當檔名避免重複
              filename = f"content/posts/youtube/yt-{video_id}.md"
              
              if os.path.exists(filename):
                  continue  # 已存在就跳過
                  
              content = f"""---
title: "{title}"
date: {published}
slug: "yt-{video_id}"
categories:
    - 電玩精華
image: "{thumbnail}"
draft: false
---

{{{{< youtube {video_id} >}}}}

{description}
"""
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(content)
                  print(f"新增影片：{title}")

          EOF

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add content/posts/youtube/
          git diff --staged --quiet || git commit -m "自動同步 YouTube 影片"
          git push